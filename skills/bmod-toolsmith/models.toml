# The `toolsmith` module's model settings, read by `bmad setup` (see `[models]` in `_bmad/config.toml`).
# `[phases]` puts each skill in the phase whose default it takes.

[phases]
bmad-toolsmith = "implementation"
bmad-eval = "validation"

# `[models] preset = "roles"`: see the method module's models.toml.

[presets.roles]
bmad-toolsmith = { model = "opus", effort = "high" }
bmad-eval = { model = "sonnet", effort = "medium" }

[presets.roles-fable]
extends = "roles"
